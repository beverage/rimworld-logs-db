[project]
name = "rimworld-logs-db"
version = "0.1.0"
description = "Builds an archive of public HugsLib logs for RimWorld that can be queried with SQL"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MrBeverage", email = "rimworld@beverage.me" }]
dependencies = [
    "boto3>=1.36",
    "pyarrow>=17",
]

[project.scripts]
rimworld-logs-db = "rimworld_logs_db.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "pytest>=8",
    "pytz",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rimworld_logs_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
